<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Anti-flash: sets data-theme before paint. Mirrors logic in
		     src/lib/theme.svelte.ts — keep localStorage keys and the
		     resolveTheme formula in sync with that module. -->
		<script>
			(function () {
				try {
					var m = localStorage.getItem('theme-mode');
					var hc = localStorage.getItem('theme-contrast') === 'true';
					if (m !== 'light' && m !== 'dark') {
						m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.dataset.theme = m + (hc ? '-hc' : '');
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
